<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f2f5; padding: 20px; }
        .box { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        button { background: #4CAF50; color: white; border: none; padding: 15px 20px; border-radius: 10px; font-size: 16px; margin: 5px; width: 80%; }
        input { padding: 10px; width: 70%; border-radius: 5px; border: 1px solid #ccc; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="box">
    <h2>NeuroQuest Math</h2>
    <p id="question">Loading...</p>
    <input type="number" id="answer" placeholder="Enter Answer">
    <br>
    <button onclick="checkAnswer()">Submit</button>
    <p id="result"></p>
</div>

<script>
    let num1, num2, correctAns;
    function nextQuestion() {
        num1 = Math.floor(Math.random() * 10) + 1;
        num2 = Math.floor(Math.random() * 10) + 1;
        correctAns = num1 + num2;
        document.getElementById('question').innerText = num1 + " + " + num2 + " = ?";
    }
    function checkAnswer() {
        let userAns = document.getElementById('answer').value;
        if(userAns == correctAns) {
            document.getElementById('result').innerText = "Sahi hai! 🎉";
            setTimeout(nextQuestion, 1000);
        } else {
            document.getElementById('result').innerText = "Galat hai, phir se try karo! ❌";
        }
        document.getElementById('answer').value = "";
    }
    nextQuestion();
</script>

</body>
</html>
