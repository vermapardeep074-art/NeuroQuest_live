<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroQuest Brain Games</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white">

    <div id="app" class="max-w-md mx-auto h-screen flex flex-col p-4">
        <div id="level-display" class="text-yellow-400 font-bold">Level 1</div>
        <div id="render-area" class="flex-1 flex items-center justify-center">
            </div>
    </div>

    <script>
        3: { instr: "Find the key!", render: (area) => { area.innerHTML = "🔑"; }},
        // 1. DATABASE (Saare levels yahan hain)
        const LEVEL_DATABASE = {
            1: { instr: "Find the biggest apple!", render: (area) => {
                area.innerHTML = `<div onclick="Game.win()" class="text-6xl cursor-pointer">🍎</div>`;
            }},
            2: { instr: "2 + 2 = ?", render: (area) => {
                area.innerHTML = `<input type="number" id="ans" class="text-black p-2"><button onclick="Game.check('ans', '4')" class="bg-blue-500 p-2 ml-2">CHECK</button>`;
            }},
            // Yahan aap level 3, 4, 5... add karte jayenge
        };

        // 2. GAME ENGINE (Game chalane ki machine)
        const Game = {
            current: 1,
            load: function(n) {
                this.current = n;
                const lvl = LEVEL_DATABASE[n] || { instr: "Coming soon!", render: (a) => a.innerHTML="Done!" };
                document.getElementById('instruction').innerText = lvl.instr;
                lvl.render(document.getElementById('render-area'));
            },
            win: function() { this.load(this.current + 1); },
            check: function(id, ans) { 
                if(document.getElementById(id).value == ans) this.win(); 
                else alert("Wrong!"); 
            }
        };

        // 3. START GAME
        window.onload = () => Game.load(1);
    </script>
</body>
</html>
