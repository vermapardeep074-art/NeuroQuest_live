<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroQuest: Pro Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Outfit', sans-serif; background: #0a0f1d; overflow: hidden; }
        .glass-panel { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body>

    <div id="ui-layer" class="absolute inset-0 z-50 pointer-events-none flex items-center justify-center">
        <!-- Start Screen -->
        <div id="start-screen" class="glass-panel p-8 rounded-3xl text-center pointer-events-auto">
            <h1 class="text-5xl font-extrabold text-white mb-2">NeuroQuest</h1>
            <p class="text-indigo-300 mb-8" id="level-display">Level 1: Focus Test</p>
            <button onclick="startGame()" class="bg-indigo-600 text-white font-bold py-3 px-10 rounded-full transition hover:scale-105">START MISSION</button>
        </div>

        <!-- HUD (Heads-Up Display) -->
        <div id="hud" class="hidden absolute top-0 w-full p-6 flex justify-between items-start pointer-events-none">
            <div class="glass-panel px-6 py-3 rounded-2xl text-white pointer-events-auto">
                <div class="text-xs uppercase text-indigo-400 font-bold">Level <span id="current-lvl">1</span></div>
                <div class="text-2xl font-bold"><span id="found-count">0</span> / <span id="target-count">4</span></div>
            </div>
            <div class="glass-panel px-6 py-3 rounded-2xl text-white pointer-events-auto">
                <div class="text-xs uppercase text-indigo-400 font-bold">Timer</div>
                <div id="timer" class="text-2xl font-bold">30s</div>
            </div>
        </div>
    </div>

    <script>
        let level = 1;
        let score = 0;
        let timeLeft = 30;
        let audioCtx;
        
        // Professional Audio Engine - Generates ambient sounds
        function playBackgroundMusic() {
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'sine'; osc.frequency.value = 220;
            gain.gain.value = 0.05;
            osc.start();
        }

        const config = { type: Phaser.AUTO, parent: 'game-container', width: window.innerWidth, height: window.innerHeight, scene: { preload, create } };
        const game = new Phaser.Game(config);

        function preload() {}
        function create() {}

        function startGame() {
            playBackgroundMusic();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            
            // Set Difficulty Scaling: Level badhne par timer kam hoga
            timeLeft = 30 - (level * 3); 
            document.getElementById('target-count').innerText = 3 + level;
            document.getElementById('current-lvl').innerText = level;
            
            startLevel();
        }

        function startLevel() {
            console.log("Level " + level + " started. Difficulty level: " + timeLeft + "s");
        }

        function endGame(won) {
            if(won) level++;
            alert(won ? "Mission Accomplished!" : "Time Out!");
            location.reload();
        }
    </script>
</body>
</html>
