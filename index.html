<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NeuroQuest Brain Games</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Nunito', sans-serif; background-color: #f8fafc; overflow: hidden; touch-action: none; }
        .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 2px solid #e2e8f0; }
        .pop-anim { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .shake-anim { animation: shake 0.5s; }
        @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-10px);} 75% {transform: translateX(10px);} }
        /* Custom Scrollbar for Grid */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="text-slate-800 h-screen w-screen flex flex-col items-center justify-center">

    <!-- MAIN MENU SCREEN -->
    <div id="screen-main" class="w-full h-full max-w-md flex flex-col items-center justify-center p-6 bg-gradient-to-b from-blue-100 to-purple-100 relative">
        <!-- Top Bar -->
        <div class="absolute top-6 left-6 right-6 flex justify-between items-center">
            <div class="glass-panel px-4 py-2 rounded-full font-bold text-amber-500 flex items-center gap-2 shadow-sm">
                <span>🪙</span> <span id="menu-coins">500</span>
            </div>
            <button class="glass-panel p-3 rounded-full text-xl shadow-sm active:scale-95 transition-transform">⚙️</button>
        </div>
        
        <!-- Title -->
        <div class="text-center mb-12 pop-anim">
            <h1 class="text-5xl font-black text-purple-700 tracking-tight drop-shadow-md">Neuro<span class="text-blue-500">Quest</span></h1>
            <p class="font-bold text-slate-500 mt-2">Train Your Brain!</p>
        </div>

        <!-- Play Button -->
        <button onclick="Game.showScreen('screen-levels')" class="w-full bg-gradient-to-r from-purple-500 to-blue-500 text-white text-3xl font-black py-5 rounded-3xl shadow-[0_8px_0_rgb(107,33,168)] active:shadow-[0_0px_0_rgb(107,33,168)] active:translate-y-2 transition-all pop-anim" style="animation-delay: 0.1s;">
            PLAY NOW
        </button>
        
        <button class="mt-6 font-bold text-purple-600 p-4 active:scale-95 transition-transform">Daily Rewards 🎁</button>
    </div>

    <!-- LEVEL SELECTOR SCREEN -->
    <div id="screen-levels" class="hidden w-full h-full max-w-md flex flex-col bg-slate-50 relative">
        <!-- Header -->
        <div class="p-6 bg-white shadow-sm flex items-center justify-between z-10">
            <button onclick="Game.showScreen('screen-main')" class="text-2xl active:scale-90">⬅️</button>
            <h2 class="text-2xl font-black text-slate-700">Select Level</h2>
            <div class="w-8"></div> <!-- Spacer -->
        </div>
        
        <!-- 1000 Levels Grid -->
        <div id="level-grid" class="flex-1 overflow-y-auto p-6 grid grid-cols-4 gap-4 content-start pb-20">
            <!-- Grid dynamically generated via JS -->
        </div>
    </div>

    <!-- GAMEPLAY SCREEN -->
    <div id="screen-game" class="hidden w-full h-full max-w-md flex flex-col bg-white relative">
        <!-- Game Header -->
        <div class="p-4 flex justify-between items-center border-b border-slate-100">
            <button onclick="Game.showScreen('screen-levels')" class="text-2xl active:scale-90">⏸️</button>
            <div class="text-xl font-black text-slate-700">Level <span id="current-lvl-txt">1</span></div>
            <button onclick="Game.useHint()" class="glass-panel px-3 py-1 rounded-full font-bold text-amber-500 flex items-center gap-1 active:scale-95 bg-amber-50 border-amber-200">
                💡 <span id="game-hints">3</span>
            </button>
        </div>

        <!-- Puzzle Instruction -->
        <div class="p-6 text-center">
            <h2 id="puzzle-instruction" class="text-2xl font-bold text-slate-800 leading-tight">Find the biggest object!</h2>
        </div>

        <!-- Interactive Puzzle Area -->
        <div id="puzzle-canvas" class="flex-1 relative flex items-center justify-center p-4">
            <!-- Dynamic elements will be injected here -->
        </div>

        <!-- Bottom Tools (Optional based on puzzle) -->
        <div id="puzzle-tools" class="p-6 min-h-[100px] flex justify-center items-center gap-4 bg-slate-50">
            <!-- Dynamic inputs/buttons -->
        </div>
    </div>

    <!-- VICTORY MODAL -->
    <div id="modal-victory" class="hidden absolute inset-0 bg-slate-900/80 flex items-center justify-center z-50 p-6 backdrop-blur-sm">
        <div class="bg-white w-full rounded-3xl p-8 text-center flex flex-col items-center pop-anim shadow-2xl">
            <div class="text-6xl mb-4">🌟</div>
            <h2 class="text-3xl font-black text-green-500 mb-2">Awesome!</h2>
            <p id="victory-message" class="text-slate-500 font-bold mb-6">Your brain IQ is increasing!</p>
            
            <div class="flex gap-4 w-full">
                <button onclick="Game.showScreen('screen-levels')" class="flex-1 bg-slate-200 text-slate-700 font-bold py-4 rounded-2xl active:scale-95">Menu</button>
                <button onclick="Game.nextLevel()" class="flex-1 bg-green-500 text-white font-black py-4 rounded-2xl shadow-[0_6px_0_rgb(21,128,61)] active:translate-y-1 active:shadow-[0_0px_0_rgb(21,128,61)] transition-all">Next Level</button>
            </div>
        </div>
    </div>

    <!-- CORE ENGINE JS -->
    <script>
        const Game = {
            state: {
                coins: 500,
                hints: 3,
                unlockedLevels: 1, // Only level 1 is unlocked initially
                currentLevel: 1
            },

            // 1000+ Level Structure Simulator
            init: function() {
                this.renderGrid();
                this.updateUI();
            },

            showScreen: function(screenId) {
                document.getElementById('screen-main').classList.add('hidden');
                document.getElementById('screen-levels').classList.add('hidden');
                document.getElementById('screen-game').classList.add('hidden');
                document.getElementById('modal-victory').classList.add('hidden');
                
                document.getElementById(screenId).classList.remove('hidden');
                
                // Add pop animation for fresh feel
                document.getElementById(screenId).classList.add('pop-anim');
                setTimeout(() => document.getElementById(screenId).classList.remove('pop-anim'), 300);
            },

            updateUI: function() {
                document.getElementById('menu-coins').innerText = this.state.coins;
                document.getElementById('game-hints').innerText = this.state.hints;
            },

            renderGrid: function() {
                const grid = document.getElementById('level-grid');
                grid.innerHTML = "";
                
                // Generating 100 levels for DOM performance (can scale to 1000)
                for(let i = 1; i <= 100; i++) {
                    const btn = document.createElement('button');
                    const isUnlocked = i <= this.state.unlockedLevels;
                    
                    if(isUnlocked) {
                        btn.className = "aspect-square rounded-2xl font-black text-2xl shadow-[0_4px_0_rgb(203,213,225)] transition-all active:translate-y-1 active:shadow-none " + 
                                        (i === this.state.unlockedLevels ? "bg-purple-500 text-white shadow-[0_4px_0_rgb(126,34,206)]" : "bg-white text-slate-700");
                        btn.innerText = i;
                        btn.onclick = () => this.loadLevel(i);
                    } else {
                        btn.className = "aspect-square rounded-2xl font-black text-2xl bg-slate-200 text-slate-400 flex items-center justify-center opacity-70";
                        btn.innerHTML = "🔒";
                        btn.onclick = () => this.shakeElement(btn); // Shake if locked
                    }
                    grid.appendChild(btn);
                }
            },

            shakeElement: function(el) {
                el.classList.add('shake-anim');
                setTimeout(() => el.classList.remove('shake-anim'), 500);
            },

            // --- Yahan 1000 Levels ka Engine start hota hai ---
switch(levelNum) {
    
    // 1. Math Puzzle (Logic/IQ)
    case 1:
        document.getElementById('puzzle-instruction').innerText = "Solve: 25 + 15 = ?";
        canvas.innerHTML = `<div class="text-6xl font-black text-slate-800">25 + 15 = ?</div>`;
        tools.innerHTML = `<input id="ans" type="number" class="p-4 border-2 rounded-xl text-2xl w-24">
                           <button onclick="if(document.getElementById('ans').value=='40') Game.winLevel('Correct!'); else Game.wrongAnswer()" class="bg-blue-500 text-white p-4 rounded-xl">CHECK</button>`;
        break;

    // 2. Physics Puzzle (Gravity/Interaction)
    case 2:
        document.getElementById('puzzle-instruction').innerText = "Drop the ball into the basket!";
        canvas.innerHTML = `<div class="w-full h-full relative">
            <div id="ball" class="w-12 h-12 bg-red-500 rounded-full absolute top-0 left-10 transition-all duration-1000" onclick="this.style.top='80%'"></div>
            <div class="absolute bottom-10 left-5 w-20 h-5 bg-green-500" onclick="Game.winLevel('Goal!')"></div>
        </div>`;
        break;

    // 3. Hidden Object (Detective Style)
    case 3:
        document.getElementById('puzzle-instruction').innerText = "Find the hidden Star!";
        canvas.innerHTML = `<div class="text-[150px]">🌕</div> 
                            <div onclick="Game.winLevel('Star Found!')" class="absolute top-20 right-10 text-4xl cursor-pointer">⭐</div>`;
        break;

    // 4. Memory Challenge (Pattern Match)
    case 4:
        document.getElementById('puzzle-instruction').innerText = "Tap the RED box first!";
        canvas.innerHTML = `<div class="grid grid-cols-2 gap-4">
            <div onclick="Game.wrongAnswer()" class="w-24 h-24 bg-blue-500"></div>
            <div onclick="Game.winLevel('Memory Perfect!')" class="w-24 h-24 bg-red-500"></div>
        </div>`;
        break;

    // 5. Tricky/Logic Puzzle (Brain Out Style)
    case 5:
        document.getElementById('puzzle-instruction').innerText = "Make the screen WHITE!";
        canvas.innerHTML = `<div id="bg" class="w-full h-full bg-black cursor-pointer"></div>`;
        document.getElementById('bg').onclick = function() { 
            this.style.background = 'white'; 
            Game.winLevel('Bright Idea!'); 
        };
        break;

    // Default Case (Agar koi level setup nahi hai)
    default:
        document.getElementById('puzzle-instruction').innerText = "Coming Soon!";
        canvas.innerHTML = `<button onclick="Game.nextLevel()" class="p-6 bg-purple-500 text-white rounded-xl">Next Level</button>`;
        break;
}
                
                // LOAD LEVEL LOGIC (Example Levels based on your GDD)
                if(levelNum === 1) {
                    document.getElementById('puzzle-instruction').innerText = "Find the biggest Apple!";
                    // Logic: Mathematical vs Physical size trick (Brain Out style)
                    canvas.innerHTML = `
                        <div class="flex flex-wrap gap-6 justify-center items-center">
                            <div onclick="Game.wrongAnswer()" class="text-[60px] cursor-pointer hover:scale-110 transition-transform">🍎</div>
                            <div onclick="Game.winLevel('Smart! Physical size matters here.')" class="text-[120px] cursor-pointer hover:scale-110 transition-transform">🍎</div>
                            <div onclick="Game.wrongAnswer()" class="text-[40px] cursor-pointer hover:scale-110 transition-transform">🍎</div>
                        </div>
                    `;
                } 
                else if(levelNum === 2) {
                    document.getElementById('puzzle-instruction').innerText = "Help Grandma cross the road!";
                    canvas.innerHTML = `
                        <div class="w-full h-full flex flex-col items-center justify-center relative">
                            <div id="traffic-light" onclick="this.innerText='🟢'; this.dataset.green='true'" data-green="false" class="text-5xl mb-10 cursor-pointer p-4 bg-slate-800 rounded-2xl select-none">🔴</div>
                            <div class="w-full h-32 bg-slate-700 flex justify-center items-center relative overflow-hidden">
                                <div class="w-full h-2 border-t-8 border-dashed border-white absolute"></div>
                                <div id="grandma" onclick="Game.moveGrandma()" class="text-6xl absolute left-2 cursor-pointer z-10 transition-all duration-1000">👵</div>
                            </div>
                        </div>
                    `;
                }
                else {
                    // GENERIC PLACEHOLDER FOR LEVELS 3 to 1000
                    document.getElementById('puzzle-instruction').innerText = "Tap to unlock!";
                    canvas.innerHTML = `
                        <button onclick="Game.winLevel('Level Cleared!')" class="text-8xl hover:scale-110 transition-transform active:scale-95 drop-shadow-lg">
                            💎
                        </button>
                    `;
                }
            },

            // Level 2 Specific Logic
            moveGrandma: function() {
                const light = document.getElementById('traffic-light');
                if(light.dataset.green === "true") {
                    document.getElementById('grandma').style.left = "80%";
                    setTimeout(() => this.winLevel("Safety first!"), 1000);
                } else {
                    this.wrongAnswer("Wait for the green light!");
                }
            },

            wrongAnswer: function(msg = "Wrong! Think differently.") {
                const canvas = document.getElementById('puzzle-canvas');
                this.shakeElement(canvas);
                
                // Show X mark temporarily
                const xMark = document.createElement('div');
                xMark.className = "absolute inset-0 flex items-center justify-center text-red-500 text-9xl font-black opacity-80 pointer-events-none";
                xMark.innerText = "❌";
                canvas.appendChild(xMark);
                setTimeout(() => xMark.remove(), 500);
            },

            winLevel: function(message) {
                document.getElementById('modal-victory').classList.remove('hidden');
                document.getElementById('victory-message').innerText = message;
                
                // Reward coins
                this.state.coins += 50;
                
                // Unlock next level if currently playing the highest unlocked
                if(this.state.currentLevel === this.state.unlockedLevels) {
                    this.state.unlockedLevels++;
                }
                
                this.updateUI();
                this.renderGrid(); // Refresh grid locks
            },

            nextLevel: function() {
                document.getElementById('modal-victory').classList.add('hidden');
                this.loadLevel(this.state.currentLevel + 1);
            },

            useHint: function() {
                if(this.state.hints > 0) {
                    this.state.hints--;
                    this.updateUI();
                    alert("Hint: Try tapping or moving objects on the screen!");
                } else {
                    alert("Out of hints! Watch an ad? (Coming soon)");
                }
            }
        };

        // Boot up the game when window loads
        window.onload = function() {
            Game.init();
        };
    </script>
</body>
</html>
